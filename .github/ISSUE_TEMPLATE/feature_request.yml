name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How could it work? Alternatives you considered are welcome too.
  - type: dropdown
    id: help
    attributes:
      label: Would you help build it?
      options: ["No, I only have the idea", "Yes, with some guidance", "Yes, I can do it"]
